name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://grocery-assistant.streamlit.app/_stcore/health")
          echo "Streamlit health status code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Expected 200 OK, got $STATUS"
          fi